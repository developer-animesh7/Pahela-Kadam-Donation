      - generic [ref=f10e28]:
        - generic [ref=f10e29]: ABOUT US
        - heading "Helping Today, Building Tomorrow." [level=1] [ref=f10e30]: Helping Today,Building Tomorrow.
        - paragraph [ref=f10e31]: Welcome to Pahela Kadam School. Established in Dhanbad, Jharkhand, and operated by the Narayani Charitable Trust, we are a dedicated day school and rehabilitation center. Our core mission is to empower children with intellectual disabilities, autism, cerebral palsy, visual, hearing, and multiple physical challenges. Through a structured combination of special education, advanced therapies, and vocational training, we help these special children break through developmental limits to lead self-reliant lives.
        - link "Read Our Story" [ref=f10e32] [cursor=pointer]:
          - /url: "#our-journey"
    - generic [ref=f10e36]:
      - generic [ref=f10e37]:
        - generic [ref=f10e38]:
          - heading "Our Mission" [level=3] [ref=f10e45]
          - paragraph [ref=f10e46]: Our mission is to empower children with intellectual, sensory, and physical challenges by providing comprehensive therapeutic care, specialized education, and adaptive vocational training. By creating targeted developmental milestones, we aim to integrate these special children into mainstream society, restoring their personal dignity, securing their human rights, and building the necessary self-reliance for them to thrive in their daily lives.
        - generic [ref=f10e47]:
          - heading "Our Vision" [level=3] [ref=f10e53]
          - paragraph [ref=f10e54]: Our vision is a society where children with developmental and physical disabilities are fully valued, respected, and given equal opportunities to live with pride. We envision a future where specialized pediatric therapies and inclusive developmental systems are accessible to every special child, regardless of socioeconomic background, enabling them to achieve independence and contribute meaningfully to their communities.
      - img "Children engaged in therapeutic activities at Pahela Kadam School" [ref=f10e56]
