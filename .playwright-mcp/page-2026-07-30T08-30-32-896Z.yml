          - heading "How We Began & Where We Stand" [level=2] [ref=f10e69]
        - generic [ref=f10e70]:
          - generic [ref=f10e73]:
            - heading "Founder's Inspiration" [level=4] [ref=f10e74]
            - paragraph [ref=f10e75]: Recognizing the acute lack of therapeutic care and cognitive integration for children with developmental limits in Dhanbad, Mrs. Anita Agarwal took the initiative to set up a comprehensive support center.
          - generic [ref=f10e78]:
            - heading "Humble Beginnings (2008)" [level=4] [ref=f10e79]
            - paragraph [ref=f10e80]: Pahela Kadam launched its operational journey in a modest layout in 2008, initially providing caring education and basic therapy to just two special needs children.
          - generic [ref=f10e83]:
            - heading "Growing Community & Family Trust" [level=4] [ref=f10e84]
            - paragraph [ref=f10e85]: As children began exhibiting measurable milestones in articulation, movement, and cognitive behavior, local families increasingly placed their trust in our school, expanding student registration.
          - generic [ref=f10e88]:
            - heading "NGO & Corporate Collaborations" [level=4] [ref=f10e89]
            - paragraph [ref=f10e90]: Collaboration with various national NGOs, social enterprises, and corporates helped fund high-end tools, interactive sensory integration labs, and specialized clinical rooms.
          - generic [ref=f10e93]:
            - heading "Today Supporting 150+ Children" [level=4] [ref=f10e94]
            - paragraph [ref=f10e95]: Today, Pahela Kadam School operates as a premier day school and comprehensive therapy lab serving over 150 special needs children with direct daily physical, vocational, and social integration support.
          - generic [ref=f10e98]:
            - generic [ref=f10e99]:
              - generic [ref=f10e100]: ⭐
              - heading "National Recognition" [level=4] [ref=f10e101]
            - paragraph [ref=f10e102]: Mrs. Anita Agarwal's lifelong dedication to empowering children with disabilities has earned recognition from national leaders. Her work reflects years of compassion, inclusive education, and unwavering commitment to building a better future for every child.
