        - heading "Frequently Asked Questions" [level=3] [ref=f12e108]
        - generic [ref=f12e109]:
          - generic [ref=f12e110]:
            - button "How can I schedule a school visit?" [ref=f12e111] [cursor=pointer]
            - paragraph [ref=f12e115]: Visits are welcomed Monday through Saturday, between 10:00 AM and 2:00 PM. Please submit our online form or call +91 9471162439 at least 24 hours in advance to schedule a guided tour.
          - generic [ref=f12e116]:
            - button "Is my donation eligible for tax exemption?" [ref=f12e117] [cursor=pointer]
            - paragraph [ref=f12e121]: Yes, all donations made to the Narayani Charitable Trust (operating Pahela Kadam School) are 100% tax-exempt under Section 80G of the Income Tax Act. Official receipts and tax certificates will be emailed to you within 7 working days.
          - generic [ref=f12e122]:
            - button "Can I donate physical materials (wheelchairs, computers)?" [ref=f12e123] [cursor=pointer]
            - paragraph [ref=f12e127]: Absolutely. We accept special education books, computers, orthopedic crutches, wheelchairs, speech training software, and art supplies. Please email pahelakadams@gmail.com with your list of items to coordinate delivery.
          - generic [ref=f12e128]:
            - button "What are the admission criteria for new students?" [ref=f12e129] [cursor=pointer]
            - paragraph [ref=f12e133]: Pahela Kadam School supports children with autism, intellectual disabilities, cerebral palsy, down syndrome, and developmental delays. Admissions are entirely free of charge for children from underprivileged families, following an initial pediatric and special educational diagnostic evaluation.
          - generic [ref=f12e134]:
            - button "How can corporate partners support Pahela Kadam School under CSR?" [ref=f12e135] [cursor=pointer]
            - paragraph [ref=f12e139]: "Corporate partners can sponsor specialized class digitizations, child pediatric therapy standing frames, or fund vocational cafe placement tracks. The trust is registered on the MCA portal (CSR Registration No: CSR00008850) for tax-exempt CSR partnerships."
