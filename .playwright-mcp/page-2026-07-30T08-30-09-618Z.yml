        - heading "Empowering Special Children Since 2008" [level=2] [ref=f7e108]
        - paragraph [ref=f7e109]: Narayani Charitable Trust operates the Pahela Kadam School for Special Children. Dedicated to the treatment, care, and cognitive support of children with intellectual disabilities, autism, cerebral palsy, and multiple developmental challenges, the day school provides occupational therapy, sensory integration support, early developmental care, and vocational skills.
        - paragraph [ref=f7e110]: Our child-first model transforms physical and developmental limits into independent steps, creating a warm community environment that supports children and guides their families.
        - link "Read Our Full Story" [ref=f7e112] [cursor=pointer]:
          - /url: /pages/about.html
